name: pr-title
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            build
            ci
            chore
            revert
          scopes: |
            cmd
            dlq
            testenv
            deps
            offsetkeeper
          requireScope: false
          # action-semantic-pull-request matches subjectPattern against the subject portion.
          # Full header length (≤72 chars total) is defined in CONTRIBUTING.md.
          subjectPattern: ^[a-z0-9](.{0,70}[^.])?$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter or digit, not end with a period, and be at most 72 characters.
